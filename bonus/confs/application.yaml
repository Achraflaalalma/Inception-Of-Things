apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: playground
  namespace: argocd

spec:
  project: default

  source:
    repoURL: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/root/alaalalm-iot.git
    targetRevision: main
    path: confs

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
